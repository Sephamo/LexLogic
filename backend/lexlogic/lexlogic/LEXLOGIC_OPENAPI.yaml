openapi: 3.1.0
info:
  title: LexLogic API
  version: 1.0.0
  description: |
    Development API contract for the LexLogic Spring Boot backend.
    Some request/response details are provisional and should be confirmed against the running service.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://manhandle-shortness-chaos.ngrok-free.dev
    description: Current ngrok forwarding URL
tags:
  - name: Authentication
  - name: Users
  - name: Biometrics
  - name: Policies
  - name: Fraud
  - name: Notifications
  - name: Audit
security:
  - BearerAuth: []
paths:
  /api/users/register:
    post:
      tags: [Authentication]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              firstName: Demo
              lastName: User
              idNumber: "7604179863081"
              phoneNumber: "+27XXXXXXXXX"
              password: ChooseAStrongPassword
      responses:
        '200':
          description: Account created; phone verification is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        default:
          $ref: '#/components/responses/GenericError'
  /api/users/login/request:
    post:
      tags: [Authentication]
      summary: Request login OTP
      security: []
      parameters:
        - in: query
          name: phoneNumber
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OTP request accepted
          content:
            text/plain:
              schema: { type: string, example: Login OTP generated successfully }
        default:
          $ref: '#/components/responses/GenericError'
  /api/users/password:
    post:
      tags: [Authentication]
      summary: Verify password
      description: Current implementation returns plain text on success. JWT issuance is not established by the available controller contract.
      security: []
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: password
          required: true
          schema: { type: string, format: password }
      responses:
        '200':
          description: Password accepted
          content:
            text/plain:
              schema: { type: string, example: Login successful }
        default:
          $ref: '#/components/responses/GenericError'
  /otp/verify:
    post:
      tags: [Authentication]
      summary: Verify registration OTP
      security: []
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: otpCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OTP verified
          content:
            text/plain:
              schema: { type: string, example: OTP verified successfully }
        default:
          $ref: '#/components/responses/GenericError'
  /otp/resend:
    post:
      tags: [Authentication]
      summary: Resend registration OTP
      security: []
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OTP resent
          content:
            text/plain:
              schema: { type: string, example: OTP resent Successfully }
        default:
          $ref: '#/components/responses/GenericError'
  /otp/login/verify:
    post:
      tags: [Authentication]
      summary: Verify login OTP
      security: []
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: otpCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Login OTP verified
          content:
            text/plain:
              schema: { type: string, example: Login OTP verified successfully }
        default:
          $ref: '#/components/responses/GenericError'
  /otp/login/resend:
    post:
      tags: [Authentication]
      summary: Resend login OTP
      security: []
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Login OTP resent
          content:
            text/plain:
              schema: { type: string, example: Login OTP resent successfully }
        default:
          $ref: '#/components/responses/GenericError'
  /api/users/profile:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/GenericError'
  /api/biometric/verify:
    post:
      tags: [Biometrics]
      summary: Verify identity using ID document and selfie
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id_image, selfie_image]
              properties:
                id_image:
                  type: string
                  format: binary
                  description: ID document image or PDF supported by the biometric service
                selfie_image:
                  type: string
                  format: binary
                  description: Selfie image
      responses:
        '200':
          description: Verification result; a failed match may still return 200 with verified false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiometricResponse' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/policies/my-policies:
    get:
      tags: [Policies]
      summary: Retrieve authenticated user's policies
      description: Requires valid JWT, verified phone, and successful biometric verification. May return an empty array.
      responses:
        '200':
          description: Policy list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Policy' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/fraud/my-flags:
    get:
      tags: [Fraud]
      summary: List authenticated user's fraud flags
      responses:
        '200':
          description: Fraud flags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FraudFlag' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/fraud/my-status:
    get:
      tags: [Fraud]
      summary: Get authenticated user's risk status
      responses:
        '200':
          description: Risk summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudStatus' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/fraud-reports:
    post:
      tags: [Fraud]
      summary: Submit a fraud report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FraudReportRequest' }
      responses:
        '200':
          description: Submitted report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudReport' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/fraud-reports/my-reports:
    get:
      tags: [Fraud]
      summary: List authenticated user's fraud reports
      responses:
        '200':
          description: Report list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FraudReport' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/notifications/my-notifications:
    get:
      tags: [Notifications]
      summary: List authenticated user's notifications
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        default:
          $ref: '#/components/responses/GenericError'
  /api/audit/my-logs:
    get:
      tags: [Audit]
      summary: List authenticated user's audit logs
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }
        default:
          $ref: '#/components/responses/GenericError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid authentication
    GenericError:
      description: Error response; exact body/status may vary by failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema: { type: string }
  schemas:
    RegisterRequest:
      type: object
      required: [firstName, lastName, idNumber, phoneNumber, password]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        idNumber: { type: string }
        phoneNumber: { type: string }
        password: { type: string, format: password }
    RegistrationResponse:
      type: object
      properties:
        message: { type: string }
        userId: { type: integer, format: int64 }
        phoneVerified: { type: boolean }
    UserProfile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        idNumber: { type: string }
        phoneNumber: { type: string }
        phoneVerified: { type: boolean }
    BiometricResponse:
      type: object
      properties:
        status: { type: string, example: failed }
        verified: { type: boolean }
        message: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        livenessPassed: { type: [boolean, 'null'] }
        faceMatch: { type: [boolean, 'null'] }
        distance: { type: [number, 'null'], format: double }
        qualityCheck: { type: [boolean, 'null'] }
    Insurer:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        apiUrl: { type: string, format: uri }
    Policy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policyNumber: { type: string }
        policyType: { type: string }
        status: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        premium: { type: number, format: double }
        policyHolderIdNumber: { type: string }
        insurer: { $ref: '#/components/schemas/Insurer' }
    FraudFlag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policyId: { type: [integer, 'null'], format: int64 }
        ruleType: { type: string }
        description: { type: string }
        riskLevel: { type: string }
        riskScore: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    FraudStatus:
      type: object
      properties:
        riskLevel: { type: string }
        riskScore: { type: integer }
        openFlags: { type: integer }
    FraudReportRequest:
      type: object
      required: [policyId, reason]
      properties:
        policyId: { type: integer, format: int64 }
        reason: { type: string }
    FraudReport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policyId: { type: integer, format: int64 }
        policyNumber: { type: string }
        reason: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        insurerReference: { type: [string, 'null'] }
        insurerMessage: { type: [string, 'null'] }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        eventType: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        message: { type: string }
        timestamp: { type: string, format: date-time }